<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APK 下载器 - 应用宝 / Google Play</title>
<style>
:root{
  --bg:#f4f6fb; --card:#fff; --ink:#1f2937; --muted:#6b7280;
  --line:#e6e9f0; --brand:#4f46e5; --brand2:#2563eb; --ok:#059669;
  --err:#dc2626; --shadow:0 4px 18px rgba(30,41,59,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
button{font:inherit;cursor:pointer}
.top{background:linear-gradient(120deg,#1e3a8a,#4338ca 55%,#6d28d9);color:#fff;padding:26px 0 30px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand h1{margin:0;font-size:24px;letter-spacing:.5px}
.brand p{margin:6px 0 0;opacity:.8;font-size:13px}
.top-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
  border-radius:10px;padding:8px 14px;font-size:12px;white-space:nowrap}
.stat b{font-size:16px;margin-right:4px}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-primary{background:#fff;color:#3730a3}
.btn-primary:hover{background:#eef2ff}
.btn-indigo{background:var(--brand);color:#fff}
.btn-indigo:hover{background:#4338ca}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:#c7d2fe;color:var(--brand)}
.btn-danger{background:#fff1f2;color:var(--err);border:1px solid #fecdd3}
.btn-danger:hover{background:#ffe4e6}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px}

main{max-width:1120px;margin:0 auto;padding:24px 20px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);padding:20px;margin-bottom:24px}
.search-row{display:flex;gap:10px}
.search-row input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;
  padding:12px 16px;font-size:15px;outline:none;transition:.15s}
.search-row input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.hot{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.hot span{color:var(--muted);font-size:12px}
.hot button{background:#f3f4f6;border:0;border-radius:20px;padding:5px 13px;color:#4b5563;font-size:12px}
.hot button:hover{background:#e0e7ff;color:var(--brand)}
.src-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.src{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;
  padding:8px 16px;font-weight:600;font-size:13px}
.src:hover{border-color:#c7d2fe;color:var(--brand)}
.src.active{background:var(--brand);border-color:var(--brand);color:#fff}
.src small{font-weight:400;opacity:.75;margin-left:6px}
.tag.play{background:#eff6ff;color:#2563eb}
.note{color:var(--muted);font-size:12px;margin-top:12px}
.note code{background:#f3f4f6;padding:2px 6px;border-radius:5px}

.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.sec-title h2{margin:0;font-size:18px}
.badge{display:inline-block;background:#eef2ff;color:var(--brand);font-size:11px;
  font-weight:600;padding:3px 9px;border-radius:20px;vertical-align:middle;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.app-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.app-head{display:flex;gap:12px;align-items:center;min-width:0}
.app-icon{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#eef2ff;flex:none}
.app-meta{min-width:0}
.app-meta h3{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-meta p{margin:4px 0 0;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#f3f4f6;color:#4b5563;border-radius:6px;padding:3px 8px;font-size:11px}
.tag.green{background:#ecfdf5;color:var(--ok)}
.slot{margin-top:auto;min-height:42px}
.dl-btn{width:100%;padding:10px;border:0;border-radius:9px;background:var(--brand);color:#fff;font-weight:600}
.dl-btn:hover{background:#4338ca}
.dl-btn.done{background:#ecfdf5;color:var(--ok)}
.progress{padding:2px 0}
.progress .p-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar{height:7px;background:#eef2f7;border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#06b6d4);border-radius:20px;transition:width .3s}
.cancel{margin-top:8px;background:none;border:0;color:var(--muted);font-size:11px;padding:0}
.cancel:hover{color:var(--err)}

.file-list{display:flex;flex-direction:column;gap:8px}
.file-row{display:flex;align-items:center;gap:14px;border:1px solid var(--line);
  border-radius:11px;padding:11px 14px;background:#fff}
.file-badge{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#dbeafe,#ede9fe);
  color:var(--brand);display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}
.file-info{flex:1;min-width:0}
.file-info strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-info small{color:var(--muted);font-size:11px}
.file-size{color:var(--muted);font-size:12px;white-space:nowrap}
.file-actions{display:flex;gap:8px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:13px}
.empty .big{font-size:30px;display:block;margin-bottom:8px;opacity:.5}
.loading{text-align:center;color:var(--muted);padding:24px}
.dir-path{font-size:11px;color:var(--muted);word-break:break-all;margin-top:10px}
#toast{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:99}
.toast{background:#111827;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .2s ease}
.toast.err{background:var(--err)}.toast.ok{background:var(--ok)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:640px){.top{padding:20px 0 22px}.brand h1{font-size:20px}.wrap{padding:0 14px}
  main{padding:18px 14px 50px}.panel{padding:14px}.file-row{flex-wrap:wrap}.file-actions{width:100%}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>APK 下载器</h1>
      <p>应用宝 / Google Play 双数据源 · 搜索海外版应用 · APK 直接下载到本地</p>
    </div>
    <div class="top-actions">
      <div class="stat"><b id="statCount">0</b>个 APK</div>
      <div class="stat"><b id="statSize">0 B</b>已占用</div>
      <button class="btn btn-primary" onclick="openFolder()">打开下载目录</button>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="src-tabs">
      <button class="src active" data-source="yyb" onclick="setSource('yyb')">应用宝<small>国内应用</small></button>
      <button class="src" data-source="gplay" onclick="setSource('gplay')">Google Play<small>海外应用</small></button>
    </div>
    <div class="search-row">
      <input id="q" placeholder="输入软件名称，例如：微信、抖音、知乎" autocomplete="off">
      <button class="btn btn-indigo" onclick="doSearch()">搜索</button>
    </div>
    <div class="hot" id="hotYyb">
      <span>热门：</span>
      <button onclick="quick('微信')">微信</button>
      <button onclick="quick('抖音')">抖音</button>
      <button onclick="quick('支付宝')">支付宝</button>
      <button onclick="quick('哔哩哔哩')">哔哩哔哩</button>
      <button onclick="quick('网易云音乐')">网易云音乐</button>
    </div>
    <div class="hot" id="hotGplay" hidden>
      <span>热门：</span>
      <button onclick="quick('Signal')">Signal</button>
      <button onclick="quick('Firefox Focus')">Firefox Focus</button>
      <button onclick="quick('Telegram')">Telegram</button>
      <button onclick="quick('Spotify')">Spotify</button>
      <button onclick="quick('Google Translate')">Google Translate</button>
    </div>
    <div class="note" id="sourceNote">应用宝只展示带有效 MD5 的安卓应用；APK 直链由 MD5 拼接应用宝 CDN，<code>绕过 UA 判断，不会下成 exe</code>。</div>
  </section>

  <section id="resultSection" hidden>
    <div class="sec-title">
      <h2>搜索结果<span class="badge">仅 APK</span></h2>
      <button class="btn btn-ghost btn-sm" id="moreBtn" onclick="doSearch(currentPage+1,true)" hidden>加载更多</button>
    </div>
    <div class="grid" id="results"></div>
    <div class="loading" id="resultLoading" hidden>搜索中…</div>
  </section>

  <section class="panel" style="margin-top:26px">
    <div class="sec-title">
      <h2>已下载的 APK</h2>
      <button class="btn btn-ghost btn-sm" onclick="loadFiles()">刷新列表</button>
    </div>
    <div class="file-list" id="files"></div>
    <div class="dir-path" id="dirPath"></div>
  </section>
</main>

<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
let currentPage=1, currentKeyword='', renderedMd5=new Set(), pollTimer=null, currentSource='yyb';
window.__apps={};
function appKey(a){return (a.source||'yyb')+':'+(a.md5||a.pkg||a.id||'')}
$('#results').addEventListener('click',e=>{
  const btn=e.target.closest('.dl-btn[data-key]');
  if(btn&&window.__apps[btn.dataset.key])download(window.__apps[btn.dataset.key]);
});
function setSource(s){
  currentSource=s;
  document.querySelectorAll('.src').forEach(b=>b.classList.toggle('active',b.dataset.source===s));
  $('#hotYyb').hidden=s!=='yyb';
  $('#hotGplay').hidden=s!=='gplay';
  $('#q').placeholder=s==='gplay'?'输入 Google Play 应用名或包名，例如：Signal、Firefox Focus':'输入软件名称，例如：微信、抖音、知乎';
  $('#sourceNote').innerHTML=s==='gplay'
    ?'Google Play 走 <code>goopdl</code> 匿名令牌，默认下载 base APK；需要稳定访问谷歌服务，限流时稍后重试。'
    :'应用宝只展示带有效 MD5 的安卓应用；APK 直链由 MD5 拼接应用宝 CDN，<code>绕过 UA 判断，不会下成 exe</code>。';
  renderedMd5.clear(); window.__apps={};
  $('#results').innerHTML=''; $('#resultSection').hidden=true;
}

function fmtSize(n){
  n=Number(n)||0;
  if(n<1024)return n+' B';
  if(n<1048576)return (n/1024).toFixed(1)+' KB';
  if(n<1073741824)return (n/1048576).toFixed(1)+' MB';
  return (n/1073741824).toFixed(2)+' GB';
}
function toast(msg,type=''){
  const el=document.createElement('div');
  el.className='toast '+type; el.textContent=msg;
  $('#toast').appendChild(el);
  setTimeout(()=>el.remove(),3200);
}
async function api(url,opt){
  const r=await fetch(url,opt);
  let d; try{d=await r.json()}catch{d={}}
  if(!r.ok||d.ok===false)throw new Error(d.error||('请求失败 '+r.status));
  return d;
}
function quick(k){$('#q').value=k;doSearch()}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});

async function doSearch(page=1,append=false){
  const kw=$('#q').value.trim();
  if(!kw){toast('请输入软件名称','err');return}
  currentKeyword=kw; currentPage=page;
  $('#resultSection').hidden=false;
  $('#resultLoading').hidden=false;
  try{
    let d;
    const url='/api/search?q='+encodeURIComponent(kw)+'&page='+page+'&source='+currentSource;
    const attempts=currentSource==='gplay'?3:1;
    for(let i=0;i<attempts;i++){
      try{d=await api(url);break}
      catch(err){if(i===attempts-1)throw err;await new Promise(r=>setTimeout(r,900))}
    }
    if(!append){renderedMd5.clear();window.__apps={};$('#results').innerHTML=''}
    renderResults(d.apps||[]);
    $('#moreBtn').hidden=!d.has_more;
    if(!(d.apps||[]).length&&!append)
      $('#results').innerHTML='<div class="empty"><span class="big">⌕</span>没有找到应用，换个关键词试试</div>';
  }catch(e){
    toast(e.message,'err');
    if(!append)$('#results').innerHTML='<div class="empty"><span class="big">!</span>'+esc(e.message)+
      '<br><small>'+(currentSource==='gplay'?'Google Play 需要稳定访问谷歌服务，已自动重试 3 次':'请检查网络后重试')+'</small></div>';
  }
  finally{$('#resultLoading').hidden=true}
}
function renderResults(apps){
  apps.forEach(app=>{
    const key=appKey(app);
    if(renderedMd5.has(key))return;
    renderedMd5.add(key);
    window.__apps[key]=app;
    const play=app.source==='gplay';
    const card=document.createElement('article');
    card.className='app-card';
    card.innerHTML=`
      <div class="app-head">
        ${play?'<div class="app-icon" style="display:grid;place-items:center;color:#2563eb;font-weight:800">GP</div>':`<img class="app-icon" src="${app.icon||''}" alt="" onerror="this.style.visibility='hidden'">`}
        <div class="app-meta"><h3 title="${esc(app.name)}">${esc(app.name)}</h3>
        <p title="${esc(app.pkg)}">${esc(app.pkg)}</p></div>
      </div>
      <div class="tags">
        <span class="tag ${play?'play':'green'}">${play?'Google Play':'v'+esc(app.version||'-')}</span>
        ${app.size?`<span class="tag">${fmtSize(app.size)}</span>`:''}
        ${app.developer?`<span class="tag">${esc(app.developer)}</span>`:''}
      </div>
      <div class="slot" id="slot-${key}">
        <button class="dl-btn" data-key="${esc(key)}">下载 APK</button>
      </div>`;
    $('#results').appendChild(card);
  });
  refreshTaskViews();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function download(app){
  try{
    const d=await api('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(app)});
    toast(d.reused?(d.done?'这个 APK 已下载过':'任务已在进行中'):'已开始下载：'+app.name,d.done?'':'ok');
    if(d.done)loadFiles(); else startPolling();
  }catch(e){toast(e.message,'err')}
}
async function cancelTask(id){
  try{await api('/api/cancel/'+id,{method:'POST'});toast('已取消');startPolling()}
  catch(e){toast(e.message,'err')}
}
function startPolling(){if(!pollTimer)pollTimer=setInterval(pollTasks,800);pollTasks()}
async function pollTasks(){
  try{
    const d=await api('/api/tasks');
    const tasks=d.tasks||[];
    tasks.forEach(refreshTaskViews);
    if(tasks.some(t=>t.status==='downloading')){if(!pollTimer)pollTimer=setInterval(pollTasks,800)}
    else{
      if(pollTimer){clearInterval(pollTimer);pollTimer=null}
      if(tasks.some(t=>t.status==='done'))loadFiles();
    }
  }catch(e){toast(e.message,'err')}
}
function refreshTaskViews(task){
  const list=task?[task]:(window.__tasks||[]);
  list.forEach(t=>{
    const slot=document.getElementById('slot-'+appKey(t));
    if(!slot)return;
    const pct=t.size?Math.min(100,Math.round(t.downloaded/t.size*100)):0;
    if(t.status==='downloading'){
      slot.innerHTML=`<div class="progress">
        <div class="p-top"><span>下载中 ${pct}%</span><span>${fmtSize(t.speed)}/s</span></div>
        <div class="bar"><i style="width:${pct}%"></i></div>
        <button class="cancel" onclick="cancelTask('${t.id}')">取消</button></div>`;
    }else if(t.status==='done'){
      slot.innerHTML='<button class="dl-btn done" onclick="openFolder(null)">✓ 已下载 · 打开目录</button>';
    }else if(t.status==='error'){
      slot.innerHTML=`<button class="dl-btn" title="${esc(t.error||'')}" onclick="location.reload()">下载失败，重试</button>`;
    }else if(t.status==='canceled'){
      slot.innerHTML='<button class="dl-btn" onclick="location.reload()">已取消</button>';
    }
  });
}
async function loadFiles(){
  try{
    const d=await api('/api/files');
    const files=d.files||[];
    $('#dirPath').textContent='保存目录：'+d.dir;
    $('#statCount').textContent=files.length;
    $('#statSize').textContent=fmtSize(files.reduce((s,f)=>s+(Number(f.size)||0),0));
    if(!files.length){
      $('#files').innerHTML='<div class="empty"><span class="big">▤</span>还没有下载过 APK，搜索一个软件开始吧</div>';
      return;
    }
    $('#files').innerHTML=files.map(f=>`
      <div class="file-row">
        <div class="file-badge">${f.source==='gplay'?'GP':'APK'}</div>
        <div class="file-info"><strong title="${esc(f.filename)}">${esc(f.name||f.filename)}</strong>
          <small>${f.source==='gplay'?'Google Play':'应用宝'} · ${esc(f.version||'')} ${esc(f.pkg||'')} · ${esc(f.downloaded_at||'')}</small></div>
        <div class="file-size">${fmtSize(f.size)}</div>
        <div class="file-actions">
          <button class="btn btn-ghost btn-sm" onclick="openFolder('${esc(f.id)}')">定位文件</button>
          <button class="btn btn-danger btn-sm" onclick="delFile('${esc(f.id)}')">删除</button>
        </div>
      </div>`).join('');
  }catch(e){toast(e.message,'err')}
}
async function openFolder(fileId){
  try{
    const d=await api('/api/open-folder',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(fileId?{file_id:fileId}:{})});
    toast('已打开：'+d.path,'ok');
  }catch(e){toast(e.message,'err')}
}
async function delFile(id){
  if(!confirm('确定删除这个 APK 文件？'))return;
  try{await api('/api/files/'+id,{method:'DELETE'});toast('已删除','ok');loadFiles()}
  catch(e){toast(e.message,'err')}
}
setInterval(async()=>{try{const d=await api('/api/tasks');window.__tasks=d.tasks||[];refreshTaskViews()}catch(e){}},2000);
loadFiles();
</script>
</body>
</html>
